services:
  postgres:
    image: postgres:16-alpine
    container_name: vigil-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vigil
    volumes:
      - vigil_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vigil"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vigil_postgres_data:
